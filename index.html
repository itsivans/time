<!DOCTYPE html>
<html>
<head>
  <title>Activity Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial; }
    #editForm, #addForm { margin-top: 16px; background: #f5f5f5; padding: 8px; border-radius: 8px; }
    li { margin-bottom: 4px; }
    .tag { background: #e1e1e1; padding: 1px 6px; border-radius: 4px; font-size: 0.95em; margin-right: 7px; }
    button { margin-left: 4px; }
  </style>
</head>
<body>
  <h2>Traccia le tue attività</h2>

  <!-- FORM AGGIUNTA -->
  <div id="addForm">
    <input type="text" id="activity" placeholder="Attività..." required>
    <input type="datetime-local" id="dateTime">
    <select id="tag">
      <option value="">--Tag--</option>
      <option>Entertainment</option>
      <option>Chess</option>
      <option>Survive</option>
      <option>Study</option>
      <option>Work</option>
      <option>Productivity</option>
      <option>Waste</option>
      <option>Gym</option>
      <option>Bike</option>
      <option>Nut</option>
      <option>Slavery</option>
      <option>Holiday</option>
      <option>Chinese</option>
      <option>Sleep</option>
    </select>
    <button onclick="addActivity()">Aggiungi</button>
  </div>

  <!-- LISTA -->
  <ul id="activityList"></ul>

  <!-- FORM MODIFICA -->
  <div id="editForm" style="display:none;">
    <input type="text" id="editActivity" placeholder="Nuova attività" required>
    <input type="datetime-local" id="editDateTime">
    <select id="editTag">
      <option value="">--Tag--</option>
      <option>Entertainment</option>
      <option>Chess</option>
      <option>Survive</option>
      <option>Study</option>
      <option>Work</option>
      <option>Productivity</option>
      <option>Waste</option>
      <option>Gym</option>
      <option>Bike</option>
      <option>Nut</option>
      <option>Slavery</option>
      <option>Holiday</option>
      <option>Chinese</option>
      <option>Sleep</option>
    </select>
    <button onclick="saveEdit()">Salva</button>
    <button onclick="cancelEdit()">Annulla</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
